[flake8]
ignore = E501, W503, E203
max-line-length = 88
max-complexity = 12
exclude = migrations

[isort]
profile = black
multi_line_output = 3
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88
known_django = django
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip = wsgi.py,asgi.py,setup.py

[tool.black]
line-length = 88
